name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: Install development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gjs gnome-shell libglib2.0-bin zip unzip meson ninja-build
          mise use --global node@20.19.2 python@3.12.11
          mise exec -- npm ci
          mise exec -- python3 -m pip install reuse==5.1.1
      - name: Install GNOME GJS checks
        env:
          GJS_CI_TOOLS_REVISION: 1f758af5b8b3cfb677fbdbeed51148d39f23e365
        run: |
          mkdir -p "$RUNNER_TEMP/gjs-ci-tools"
          curl --fail --location "https://gitlab.gnome.org/World/javascript/gjs-ci-tools/-/archive/$GJS_CI_TOOLS_REVISION/gjs-ci-tools-$GJS_CI_TOOLS_REVISION.tar.gz" -o "$RUNNER_TEMP/gjs-ci-tools.tar.gz"
          tar -xzf "$RUNNER_TEMP/gjs-ci-tools.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/gjs-ci-tools"
          meson setup "$RUNNER_TEMP/gjs-ci-tools-build" "$RUNNER_TEMP/gjs-ci-tools" --prefix "$RUNNER_TEMP/gjs-ci-tools-install"
          meson install -C "$RUNNER_TEMP/gjs-ci-tools-build"
          echo "$RUNNER_TEMP/gjs-ci-tools-install/bin" >> "$GITHUB_PATH"
      - name: Check commit subjects
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mise exec -- python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          base = os.environ["COMMIT_BASE"]
          revision = f"{base}..HEAD" if base and set(base) != {"0"} else "HEAD"
          arguments = ["git", "log", "--no-merges", "--format=%s"]
          if revision == "HEAD":
              arguments.append("-1")
          subjects = subprocess.check_output(arguments + [revision], text=True).splitlines()
          invalid = [subject for subject in subjects if not subject or subject != subject.lower() or subject.endswith(".") or re.match(r"^[a-z]+(?:\([^)]*\))?!?: ", subject)]
          for subject in invalid:
              print(f"Invalid commit subject: {subject}", file=sys.stderr)
          sys.exit(bool(invalid))
          PY
      - name: Run checks
        run: mise exec -- npm run check
