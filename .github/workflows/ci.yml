name: checks

on:
  push:
    branches: ['**']
    tags: ['**', '!latest-build', '!latest-release']
  pull_request:
    paths-ignore:
      - '**/*.md'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.ref_name != 'latest-build' && github.ref_name != 'latest-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: checks-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      publish: ${{ steps.channel.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select curl publication
        id: channel
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          publish=false
          if [[ "$EVENT" == push && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            publish=true
          elif [[ "$EVENT" == push || "$EVENT" == release ]]; then
            tag=${GITHUB_REF#refs/tags/}
            if [[ "$GITHUB_REF" == refs/tags/* && "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          version: 2026.10.4
          install: true
      - name: Install development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gjs gnome-shell libglib2.0-bin gir1.2-gtk-4.0 gir1.2-adw-1 libjavascriptcoregtk-6.0-1 gettext bubblewrap openssl gnupg zip unzip python3-venv
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mise exec -- npm ci
      - name: Prepare the visual worker's user manager
        run: |
          uid=$(id -u)
          manager="user@$uid.service"
          if ! systemctl is-active --quiet "$manager"; then
            sudo systemctl start "$manager"
            echo "SLH_CI_MANAGER=$manager" >> "$GITHUB_ENV"
          fi
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "SLH_CI_SCOPE=slh-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.scope" >> "$GITHUB_ENV"
          echo "SLH_CI_SLICE=slhsource$GITHUB_RUN_ID$GITHUB_RUN_ATTEMPT.slice" >> "$GITHUB_ENV"
      - name: Install pinned GNOME GJS checks
        run: mise run setup:gjs
      - name: Run all source and isolated authentication checks
        run: |
          busctl --user call org.freedesktop.systemd1 /org/freedesktop/systemd1 \
            org.freedesktop.systemd1.Manager StartTransientUnit 'ssa(sv)a(sa(sv))' \
            "$SLH_CI_SLICE" fail 4 MemoryMax t 2147483648 \
            CPUQuotaPerSecUSec t 2000000 TasksMax t 600 CollectMode s inactive-or-failed 0
          systemd-run --user --scope --quiet --collect --expand-environment=no \
            --unit="$SLH_CI_SCOPE" --slice="$SLH_CI_SLICE" --property=TasksMax=infinity \
            mise exec -- npm run check
      - name: Clean development dependencies
        if: always()
        run: |
          if [[ -n "${SLH_CI_SCOPE:-}" ]]; then
            systemctl --user stop "$SLH_CI_SCOPE" || true
          fi
          if [[ -n "${SLH_CI_SLICE:-}" ]]; then
            systemctl --user stop "$SLH_CI_SLICE" || true
          fi
          if [[ -n "${SLH_CI_MANAGER:-}" ]]; then
            sudo systemctl stop "$SLH_CI_MANAGER"
          fi
          rm -rf node_modules dev/.tools

  native:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: native-${{ github.workflow }}-${{ github.ref }}-${{ matrix.shell }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shell: 45
            image: registry.fedoraproject.org/fedora:39@sha256:cec481e2f23201e51aef96c1811fbad730e952a35e60686b082de23c36c44683
          - shell: 46
            image: registry.fedoraproject.org/fedora:40@sha256:13aabccdff710503b5c7874810d1b50b2a64767875bca25509d147b7cdc487b8
          - shell: 47
            image: registry.fedoraproject.org/fedora:41@sha256:893f7eeffce8e3e2bb2bc62786ba5603fb1e0bd6ba07091acb892266b95bafdf
          - shell: 48
            image: registry.fedoraproject.org/fedora:42@sha256:e78cd1a688cd079c23864f289a89a49a3f4ad66d817864e325e1d058310ee95c
          - shell: 49
            image: registry.fedoraproject.org/fedora:43@sha256:005ce311c13eaa639de9d9c52e470f10652c7371561697fb8c1c6e852e23c481
          - shell: 50
            image: registry.fedoraproject.org/fedora:44@sha256:ba35579e107f26a4c2c000390fb3ff549f3858a9584a6b5a35f7fa51f54de309
          - shell: 51
            image: registry.fedoraproject.org/fedora:45@sha256:cc55518dc3593184519ae4184a814a26d6405b42713762d57353659fd7105445
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          version: 2026.10.4
          install: false
      - name: Allow isolated user namespaces on the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test actual GNOME Shell runtime
        env:
          SHELL_VERSION: ${{ matrix.shell }}
          SHELL_IMAGE: ${{ matrix.image }}
        run: mise exec -- bash tests/shell/run-container.sh "$SHELL_VERSION" "$SHELL_IMAGE"

  build-release:
    needs: [checks, native]
    if: needs.checks.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: curl-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      commit: ${{ steps.bundle.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          version: 2026.10.4
          install: false
      - name: Build the checked source bundle
        id: bundle
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: mise exec -- bash scripts/build-release.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: curl-release
          path: ${{ steps.bundle.outputs.directory }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: curl-publish-${{ github.ref_type == 'tag' && 'stable' || 'dev' }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          version: 2026.10.4
          install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: curl-release
          path: dist/publish
      - name: Publish curl installation assets
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ needs.build-release.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: mise exec -- bash scripts/publish-release.sh dist/publish
