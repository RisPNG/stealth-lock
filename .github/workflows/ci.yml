name: checks

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          version: 2026.10.4
          install: true
      - name: Install development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gjs gnome-shell libglib2.0-bin gir1.2-gtk-4.0 gir1.2-adw-1 libjavascriptcoregtk-6.0-1 gettext bubblewrap openssl gnupg zip unzip python3-venv
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mise exec -- npm ci
      - name: Prepare the visual worker's user manager
        run: |
          uid=$(id -u)
          manager="user@$uid.service"
          if ! systemctl is-active --quiet "$manager"; then
            sudo systemctl start "$manager"
            echo "SLH_CI_MANAGER=$manager" >> "$GITHUB_ENV"
          fi
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "SLH_CI_SCOPE=slh-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.scope" >> "$GITHUB_ENV"
          echo "SLH_CI_SLICE=slhsource$GITHUB_RUN_ID$GITHUB_RUN_ATTEMPT.slice" >> "$GITHUB_ENV"
      - name: Install pinned GNOME GJS checks
        run: mise run setup:gjs
      - name: Run all source and isolated authentication checks
        run: |
          busctl --user call org.freedesktop.systemd1 /org/freedesktop/systemd1 \
            org.freedesktop.systemd1.Manager StartTransientUnit 'ssa(sv)a(sa(sv))' \
            "$SLH_CI_SLICE" fail 4 MemoryMax t 2147483648 \
            CPUQuotaPerSecUSec t 2000000 TasksMax t 600 CollectMode s inactive-or-failed 0
          systemd-run --user --scope --quiet --collect --expand-environment=no \
            --unit="$SLH_CI_SCOPE" --slice="$SLH_CI_SLICE" --property=TasksMax=infinity \
            mise exec -- npm run check
      - name: Clean development dependencies
        if: always()
        run: |
          if [[ -n "${SLH_CI_SCOPE:-}" ]]; then
            systemctl --user stop "$SLH_CI_SCOPE" || true
          fi
          if [[ -n "${SLH_CI_SLICE:-}" ]]; then
            systemctl --user stop "$SLH_CI_SLICE" || true
          fi
          if [[ -n "${SLH_CI_MANAGER:-}" ]]; then
            sudo systemctl stop "$SLH_CI_MANAGER"
          fi
          rm -rf node_modules dev/.tools

  native:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shell: 45
            image: registry.gitlab.gnome.org/gnome/mutter/fedora/39@sha256:4b03855787ec1e93dba683727c45bb4c3866fa6f50483ebff8b57d5f90480222
          - shell: 46
            image: registry.gitlab.gnome.org/gnome/mutter/fedora/40@sha256:0e9c049a3f09817b519209148431bfb0bac8c64c41a0802806653579858b646a
          - shell: 47
            image: registry.gitlab.gnome.org/gnome/mutter/fedora/41@sha256:e618cc9725ed188e8411f22c90fd20783bc32a075798ce5cc0152792ded2efbc
          - shell: 48
            image: registry.gitlab.gnome.org/gnome/mutter/fedora/42@sha256:f38abfa7582a77aca3baab8cb95af22b611f395a2f089a0fad8b3b7015c07e81
          - shell: 49
            image: registry.gitlab.gnome.org/gnome/mutter/fedora/43@sha256:562ed214c807dae4f94178d6cb9497e526c106102edefe8ff7294d88e2847859
          - shell: 50
            image: registry.gitlab.gnome.org/gnome/mutter/fedora/44@sha256:d6af0e9dd27d32de34ef4a8025220499f90e0f0211ae0d4e8e1af076166c043b
          - shell: 51
            image: registry.gitlab.gnome.org/gnome/mutter/fedora/45@sha256:093cce1a3c819c27c075e347e195be91145197bff869ba7325f5c934fab3bf88
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          version: 2026.10.4
          install: false
      - name: Allow isolated user namespaces on the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test actual GNOME Shell runtime
        env:
          SHELL_VERSION: ${{ matrix.shell }}
          SHELL_IMAGE: ${{ matrix.image }}
        run: mise exec -- bash tests/shell/run-container.sh "$SHELL_VERSION" "$SHELL_IMAGE"
